<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisor de cuenta SOAT</title>
<style>
:root{--bg:#f6f7f9;--sur:#fff;--tx:#1b1f24;--tx2:#57606a;--brd:#d8dde3;--ok:#1a7f37;--warn:#9a6700;--err:#cf222e;--acc:#0969da;--okb:#dafbe1;--warnb:#fff8c5;--errb:#ffebe9;--infb:#ddf4ff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--sur:#161b22;--tx:#e6edf3;--tx2:#8b949e;--brd:#30363d;--ok:#3fb950;--warn:#d29922;--err:#f85149;--acc:#58a6ff;--okb:#12261e;--warnb:#2d2410;--errb:#2d1517;--infb:#10243a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--tx2);margin:0 0 16px}
#drop{border:2px dashed var(--brd);border-radius:12px;background:var(--sur);padding:28px 16px;text-align:center;cursor:pointer;transition:.15s}
#drop.on{border-color:var(--acc);background:var(--infb)}
#drop b{font-size:15px}
.priv{font-size:12px;color:var(--tx2);margin-top:6px}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:12px;margin-top:16px;overflow:hidden}
.hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--brd)}
.hd h2{font-size:15px;margin:0;flex:1;min-width:180px}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600}
.p-ok{background:var(--okb);color:var(--ok)}.p-warn{background:var(--warnb);color:var(--warn)}.p-err{background:var(--errb);color:var(--err)}
.sec{padding:6px 14px 10px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx2);margin:10px 0 4px}
.it{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--brd)}
.it:last-child{border-bottom:0}
.ic{width:18px;flex:none;text-align:center;font-weight:700}
.l-ok .ic{color:var(--ok)}.l-warn .ic{color:var(--warn)}.l-err .ic{color:var(--err)}.l-info .ic{color:var(--acc)}
.t{flex:1}.t small{display:block;color:var(--tx2)}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:4px 0}
td,th{border:1px solid var(--brd);padding:4px 7px;text-align:left}th{background:var(--bg)}
button{font:inherit;border:1px solid var(--brd);background:var(--sur);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.lst{padding:8px 14px 14px;border-top:1px solid var(--brd)}
.lst h3{font-size:13px;margin:6px 0 8px}
.lb{padding:8px 10px;border-radius:8px;font-weight:600;margin-bottom:8px}
.lb.b-ok{background:var(--okb);color:var(--ok)}.lb.b-warn{background:var(--warnb);color:var(--warn)}.lb.b-err{background:var(--errb);color:var(--err)}
.ci{display:flex;gap:8px;padding:5px 0;align-items:flex-start}
.ci input{margin-top:3px;width:16px;height:16px;flex:none}
.ci label{flex:1;cursor:pointer}.ci.ok label,.ci.fail label{cursor:default}
.ci .tg{font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;white-space:nowrap}
.tg-ok{background:var(--okb);color:var(--ok)}.tg-fail{background:var(--errb);color:var(--err)}
.ci.done label{color:var(--tx2);text-decoration:line-through}
#bar{display:none;margin-top:14px;gap:8px;flex-wrap:wrap}
#st{margin-top:10px;color:var(--tx2);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Revisor de cuenta SOAT</h1>
<p class="sub">Arrastra los archivos de una o varias cuentas (XML o ZIP del XML, RIPS, CUV y los PDF de soportes). Antes de digitar, te dice qué falta y qué no cuadra.</p>
<div id="drop"><b>Suelta aquí los archivos o haz clic para elegirlos</b><div class="priv">🔒 Todo se revisa en tu computador. No se sube ni se guarda nada.</div></div>
<input type="file" id="fi" multiple style="display:none">
<div id="st"></div>
<div id="bar"><button class="pri" id="bdl">⬇ Descargar informe</button><button id="bcl">Limpiar</button></div>
<div id="out"></div>
</main>
<script>
// ───────── Guía de nombramiento (Resolución 2284/2023) ─────────
const SOP = {FEV:'Factura XML',RIP:'RIPS',CUV:'CUV',FUR:'FUR',SER:'FUR Servicios',OPF:'Orden o prescripción',HEV:'Resumen de atención / evolución',CRC:'Comprobante de recibido',HAO:'Hoja odontológica',PDX:'Apoyo diagnóstico',HAM:'Administración de medicamentos',LDP:'Lista de precios',HAU:'Hoja de urgencias',EPI:'Epicrisis',TAP:'Traslado asistencial',RAN:'Registro de anestesia',DQX:'Descripción quirúrgica',FMO:'Factura material osteosíntesis',FAT:'Copia factura a aseguradora',FAC:'Factura PDF',IPO:'Aviso a autoridad / Anexo 2',CVE:'Acreditación evento catastrófico',FCT:'Certificación servicios tercerizados',CRA:'Carta de agotamiento de aseguradora',TIR:'Tarifas interinstitucionales',ADM:'Anexo adicional'};
const NIVEL_FACTURA = new Set(['FEV','RIP','CUV','OPF','HEV','CRC','HAO','PDX','HAM','LDP','HAU','EPI','TAP','RAN','DQX','FMO','FAT','FAC','IPO','CVE','FCT','CRA','TIR','ADM']);
const MESES = {ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12,enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};
const PLAZO_HABILES = 22;

// ───────── Días hábiles (misma lógica del sistema) ─────────
const _festCache={};
function festivosCO(y){
  if(_festCache[y]) return _festCache[y];
  const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const f=(m,d)=>new Date(y,m-1,d);
  const sumar=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
  const alLunes=d=>{const w=d.getDay();return w===1?d:sumar(d,(8-w)%7)};
  const a=y%19,b=Math.floor(y/100),c=y%100,dd=Math.floor(b/4),e=b%4,ff=Math.floor((b+8)/25),gg=Math.floor((b-ff+1)/3);
  const h=(19*a+b-dd-gg+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const pascua=f(Math.floor((h+l-7*m+114)/31),((h+l-7*m+114)%31)+1);
  return _festCache[y]=new Set([f(1,1),f(5,1),f(7,20),f(8,7),f(12,8),f(12,25),alLunes(f(1,6)),alLunes(f(3,19)),alLunes(f(6,29)),alLunes(f(8,15)),alLunes(f(10,12)),alLunes(f(11,1)),alLunes(f(11,11)),sumar(pascua,-3),sumar(pascua,-2),alLunes(sumar(pascua,39)),alLunes(sumar(pascua,60)),alLunes(sumar(pascua,68))].map(iso));
}
const _iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const _pd=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const esHabil=d=>d.getDay()!==0&&d.getDay()!==6&&!festivosCO(d.getFullYear()).has(_iso(d));
function limiteRadicacion(fexp){const d=_pd(fexp);let c=esHabil(d)?1:0;while(c<PLAZO_HABILES){d.setDate(d.getDate()+1);if(esHabil(d))c++}return _iso(d)}
function habilesEntre(desdeIso,hastaIso){const a=_pd(desdeIso),b=_pd(hastaIso);let n=0;const d=new Date(a);if(b>=a){while(d<b){d.setDate(d.getDate()+1);if(esHabil(d))n++}return n}while(d>b){if(esHabil(d))n--;d.setDate(d.getDate()-1)}return n}

// ───────── Utilidades ─────────
const $=id=>document.getElementById(id);
const money=n=>'$'+Math.round(n).toLocaleString('es-CO');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ');
const STOP=new Set(['de','del','la','el','en','y','o','a','con','por','para','sin','x','un','una','los','las','al','qx','ml','mg']);
const toks=s=>norm(s).split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function cargarScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar '+src));document.head.appendChild(s)})}
let _jszip=null,_pdfjs=null;
async function getJSZip(){if(!_jszip){await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');_jszip=window.JSZip}return _jszip}
async function getPdfJs(){if(!_pdfjs){await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';_pdfjs=window.pdfjsLib}return _pdfjs}
async function textoPDF(file){
  const lib=await getPdfJs();
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let txt='';
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p),c=await pg.getTextContent();
    let y=null;
    c.items.forEach(it=>{const yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>2)txt+='\n';else if(y!==null)txt+='  ';txt+=it.str;y=yy});
    txt+='\n';
  }
  return {txt,pages:pdf.numPages};
}

// Firmas del profesional: nombre + especialidad + registro médico o documento de identidad
function revisarFirmas(txt){
  const L=txt.split(/\n/).map(x=>x.replace(/\s+/g,' ').trim()), out={bloques:0,faltas:[],profs:[]};
  const LAB=/(registro\s*m[eé]d\w*|reg\.?\s*m[eé]d\w*|tarjeta\s+profesional)/ig;
  const ESPW=/m[eé]dic[oa]s?|especialista|ortop[eé]dia|ortop[eé]dic[oa]|cirujan[oa]|cirug[ií]a|anest[eé]si\w+|pediatr\w+|ginec\w+|internist\w+|urgencias|enfermer[oa]|fisioterap\w+|terapeuta|radi[oó]log\w+|odont[oó]log\w+|psic[oó]log\w+|general|traumatolog[ií]a|s\.?s\.?o\.?/ig;
  const BOIL=/este documento no registra firma[^\n]*|licenciado a:[^\n]*|c[eé]dula\s*:?|\bcc\b/ig;
  const limp=x=>(x||'').replace(LAB,' ').replace(BOIL,' ').replace(/\d+|[-:.,\[\]()]+/g,' ').replace(/\s+/g,' ').trim();
  const esNom=x=>{const t=limp(x);return /^[A-ZÁÉÍÓÚÑ]{2,}( [A-ZÁÉÍÓÚÑ]{2,}){1,4}$/.test(t)&&!new RegExp(ESPW.source,'i').test(t)?t:''};
  const esEsp=x=>{const t=limp(x);return t&&t.length<=50&&new RegExp(ESPW.source,'i').test(t)&&/^[A-ZÁÉÍÓÚÑ ]+$/.test(t)?t:''};
  L.forEach((ln,i)=>{
    if(!/registro\s*m[eé]d|reg\.?\s*m[eé]d|tarjeta\s+profesional/i.test(ln)) return;
    const w=L.slice(Math.max(0,i-3),i+4);
    const near=L.slice(Math.max(0,i-2),i+2).join(' ');
    if(!/\d{2,}/.test(near)) return;
    out.bloques++;
    const sinLab=w.join('\n').replace(LAB,' ').replace(BOIL,' ');
    const esp=new RegExp(ESPW.source,'i').test(sinLab);
    const resto=sinLab.replace(ESPW,' ').replace(/[\d\-:.,\[\]()]+/g,' ');
    const nom=/[A-ZÁÉÍÓÚÑ]{3,}( [A-ZÁÉÍÓÚÑ]{2,}){1,4}/.test(resto);
    if(!nom) out.faltas.push('nombre del profesional');
    if(!esp) out.faltas.push('especialidad');
    // datos del profesional (para aprender): registro, nombre y especialidad
    const rg=(ln.match(/(\d{2,})\s+(?:registro|reg\.?|tarjeta)/i)||ln.match(/(?:registro\s*m[eé]d\w*|reg\.?\s*m[eé]d\w*|tarjeta\s+profesional)\s*:?\s*(\d{2,})/i)||(L[i-1]||'').match(/^(\d{2,})$/)||(L[i+1]||'').match(/^(\d{2,})\b/)||[])[1];
    let nombre='',especialidad='';
    [L[i-1],L[i+1],L[i-2],ln].forEach(x=>{if(!nombre)nombre=esNom(x)});
    [L[i+1],L[i+2],L[i-1],ln,L[i+3]].forEach(x=>{if(!especialidad)especialidad=esEsp(x)});
    if(rg&&nombre&&especialidad) out.profs.push({reg:rg,nombre,esp:especialidad});
  });
  return out;
}

// ───────── Lectura de XML / RIPS / CUV ─────────
const loc=(n,name)=>[...n.getElementsByTagName('*')].filter(e=>e.localName===name);
const first=(n,name)=>loc(n,name)[0]||null;
const hijoTxt=(n,name)=>{if(!n)return '';const h=[...n.children].find(c=>c.localName===name);return h?h.textContent.trim():''};
function parseFacturaXML(xml){
  let doc=new DOMParser().parseFromString(xml,'text/xml');
  let inv=doc.documentElement.localName==='Invoice'?doc.documentElement:null;
  if(!inv){
    const d=loc(doc,'Description').map(e=>e.textContent).find(t=>t.includes('<Invoice')||t.includes(':Invoice'));
    if(d) inv=new DOMParser().parseFromString(d,'text/xml').documentElement;
  }
  if(!inv||inv.localName!=='Invoice') return null;
  const lines=loc(inv,'InvoiceLine').map(l=>({
    desc:(first(first(l,'Item')||l,'Description')?.textContent||'').trim(),
    qty:parseFloat(first(l,'InvoicedQuantity')?.textContent)||0,
    monto:parseFloat(first(l,'LineExtensionAmount')?.textContent)||0}));
  const lmt=first(inv,'LegalMonetaryTotal');
  const sup=first(inv,'AccountingSupplierParty');
  return {id:hijoTxt(inv,'ID'),cufe:hijoTxt(inv,'UUID'),fecha:hijoTxt(inv,'IssueDate'),hora:hijoTxt(inv,'IssueTime'),
    total:parseFloat(hijoTxt(lmt,'PayableAmount'))||0,
    nit:(first(sup||inv,'CompanyID')?.textContent||'').trim(),lines};
}
function recolectarRips(r){
  const out={procs:[],meds:[],otros:[],urg:[],hosp:[],cons:[],total:0,fechas:[],users:(r.usuarios||[]).length,docs:[]};
  (r.usuarios||[]).forEach(u=>{
    out.docs.push(String(u.numDocumentoIdentificacion||''));
    const s=u.servicios||{};
    (s.consultas||[]).forEach(x=>{out.cons.push(x);out.total+=+x.vrServicio||0;x.fechaInicioAtencion&&out.fechas.push(x.fechaInicioAtencion)});
    (s.procedimientos||[]).forEach(x=>{out.procs.push(x);out.total+=+x.vrServicio||0;x.fechaInicioAtencion&&out.fechas.push(x.fechaInicioAtencion)});
    (s.urgencias||[]).forEach(x=>{out.urg.push(x);x.fechaInicioAtencion&&out.fechas.push(x.fechaInicioAtencion)});
    (s.hospitalizacion||[]).forEach(x=>{out.hosp.push(x);x.fechaInicioAtencion&&out.fechas.push(x.fechaInicioAtencion)});
    (s.medicamentos||[]).forEach(x=>{out.meds.push(x);out.total+=(+x.vrUnitMedicamento||0)*(+x.cantidadSuministrada||0);x.fechaDispensAdmon&&out.fechas.push(x.fechaDispensAdmon)});
    (s.otrosServicios||[]).forEach(x=>{out.otros.push(x);out.total+=+x.vrServicio||0;x.fechaSuministroTecnologia&&out.fechas.push(x.fechaSuministroTecnologia)});
  });
  return out;
}

// ───────── Agrupar archivos por factura ─────────
const RX=/^(?:[0-9a-f]{8}-)?([A-Za-z]{3,4})_(\d{6,12})_([A-Za-z0-9]+)\.(\w+)$/;
const RXN=/^(?:[0-9a-f]{8}-)?([A-Za-z]{3})_(\d{6,12})\.(\w+)$/;
let GRUPOS={},SUELTOS=[],INFORME='',RESULT={};
function agrupar(files){
  GRUPOS={};SUELTOS=[];
  files.forEach(f=>{
    let m=f.name.match(RX);
    if(m){
      const orig=m[1].toUpperCase(); const p=({XML:'FEV',RIPS:'RIP',FEVX:'FEV'})[orig]||orig;
      const k=m[3].toUpperCase(); (GRUPOS[k]=GRUPOS[k]||{nit:m[2],files:[]}).files.push({p,orig,f,ext:m[4].toLowerCase(),nit:m[2]});
    } else if(RXN.test(f.name)) SUELTOS.push({f,motivo:'FUR/SER a nivel de NIT: se revisan cuando estén generados'});
    else SUELTOS.push({f,motivo:'El nombre no sigue la guía (PREFIJO_NIT_FACTURA.ext)'});
  });
}

// ───────── Revisión de una cuenta ─────────
async function revisar(key,g){
  const R=[]; const add=(sec,lvl,msg,det)=>R.push({sec,lvl,msg,det});
  const tiene=p=>g.files.filter(x=>x.p===p);
  const prefijos=new Set(g.files.map(x=>x.p));
  const nitG=g.nit;

  // 1. Nombres
  g.files.forEach(x=>{
    if(x.orig!==x.p) add('Nombres','err',`${x.f.name}: el prefijo ${x.orig} no es el de la guía`,`Debe llamarse ${x.p}_${x.nit}_${key}.${x.ext==='zip'?'xml':x.ext} (el ZIP de la DIAN no se envía: va el XML dentro).`);
    if(!SOP[x.p]) add('Nombres','warn',`Prefijo desconocido: ${x.f.name}`,'No está en la guía de nombramiento.');
    else if(x.p==='FEV'&&!['xml','zip'].includes(x.ext)) add('Nombres','err',`${x.f.name}: la factura debe ser .xml (o .zip que lo contenga)`);
    else if(['RIP','CUV'].includes(x.p)&&x.ext!=='json') add('Nombres','err',`${x.f.name}: debe ser .json`);
    else if(!['FEV','RIP','CUV'].includes(x.p)&&x.ext!=='pdf') add('Nombres','err',`${x.f.name}: debe ser .pdf`);
    if(x.nit!==nitG) add('Nombres','err',`${x.f.name}: el NIT del nombre (${x.nit}) no es el de los demás archivos (${nitG})`);
  });

  // 2. Lectura de contenido
  let fx=null,rips=null,cuv=null;
  for(const x of tiene('FEV')){
    try{
      let xml;
      if(x.ext==='zip'){const Z=await getJSZip();const z=await Z.loadAsync(await x.f.arrayBuffer());const n=Object.keys(z.files).find(k=>/\.xml$/i.test(k));if(!n)throw new Error('el ZIP no contiene un XML');xml=await z.files[n].async('string')}
      else xml=await x.f.text();
      fx=parseFacturaXML(xml); if(!fx) throw new Error('no se encontró la factura (Invoice) dentro del XML');
    }catch(e){add('Archivos','err',`No pude leer la factura XML: ${e.message}`)}
  }
  try{const x=tiene('RIP')[0];if(x)rips=JSON.parse(await x.f.text())}catch(e){add('Archivos','err',`No pude leer el RIPS: ${e.message}`)}
  try{const x=tiene('CUV')[0];if(x)cuv=JSON.parse(await x.f.text())}catch(e){add('Archivos','err',`No pude leer el CUV: ${e.message}`)}
  const rr=rips?recolectarRips(rips):null;

  // 3. Obligatorios
  const exige=(p,txt,lvl='err')=>{ if(!prefijos.has(p)) add('Soportes',lvl,`Falta ${p} — ${SOP[p]}`,txt); };
  ['FEV','RIP','CUV','FAC','IPO'].forEach(p=>exige(p,p==='IPO'?'Obligatorio en reclamaciones por accidente de tránsito.':'Obligatorio en toda cuenta.'));
  const quirur=rr&&rr.procs.some(p=>String(p.grupoServicios)==='04'); let posterior=false; const prof=[];
  if(!prefijos.has('EPI')&&!prefijos.has('HEV')) add('Soportes','err','Falta resumen de atención: HEV o EPI','Debe haber al menos uno.');
  if(rr){
    const gs=new Set(rr.procs.map(p=>String(p.grupoServicios)));
    if(gs.has('04')){exige('DQX','El RIPS reporta procedimientos quirúrgicos.');exige('RAN','Si hubo anestesia diferente a local, debe ir el registro de anestesia (confírmalo).','warn')}
    if(gs.has('02')) exige('PDX','El RIPS reporta apoyo diagnóstico.','warn');
    if(rr.urg.length) exige('HAU','El RIPS reporta atención de urgencias.');
    if(rr.meds.length) exige('HAM','El RIPS reporta medicamentos.');
    if(rr.hosp.length) exige('EPI','El RIPS reporta hospitalización.');
  }
  if(fx){
    const d=fx.lines.map(l=>l.desc).join(' | ');
    if(/traslad|ambulanc|transporte/i.test(d)){exige('TAP','La factura incluye transporte/traslado.');exige('TIR','Si es transporte interinstitucional secundario.','warn')}
    if(/osteos[ií]ntesis|placa|tornillo|clavo|alambre/i.test(d)&&!/extracci|retiro/i.test(d)) exige('FMO','La factura incluye material de osteosíntesis.');
  }
  add('Soportes','info','Por confirmar a mano (no se deducen de los archivos)','CRA si hay póliza diferencial o agotamiento de tope · FCT si hay servicios tercerizados · CVE si es evento catastrófico.');

  // 4. Cruces XML / RIPS / CUV
  if(fx){

    if(String(rips.numDocumentoIdObligado||'')!==nitG) add('Cruces','err',`El NIT del RIPS (${rips.numDocumentoIdObligado}) no coincide con el del nombre (${nitG})`);
  }
  if(cuv){
    if(String(cuv.NumFactura||'').toUpperCase()!==key) add('Cruces','err',`El CUV es de la factura ${cuv.NumFactura}, no de ${key}`);
    const res=cuv.ResultadosValidacion||[];
    const rech=res.filter(x=>String(x.Clase).toUpperCase()!=='NOTIFICACION');

    // Servicio posterior al evento (p. ej. retiro de material): basta la historia clínica; la epicrisis no es obligatoria
    {

      const ev0=fe0?`${fe0[3]}-${fe0[2]}-${fe0[1]}`:'';

        else add('Soportes','err','Falta EPI — Epicrisis','El Manual de auditoría de la ADRES la exige cuando hay cirugía u hospitalización; si el servicio es posterior al evento (control, retiro de material) basta la historia clínica (HEV), pero debe estar anexa.');
      }
    }

    {
      const ev=[];

      const ipoR=(T.IPO||[]).join('\n'); const pr=ipoR.match(/Prestador\s+que\s+Remite[ \t]+(\S[^\n]*)/i);

    }
    const num=key.replace(/\D/g,'').replace(/^0+/,'');
    (T.FAC||[]).forEach(t=>{ if(num&&!t.replace(/\D/g,'').includes(num)) add('Contenido','err',`El PDF de la factura (FAC) no muestra el número ${key}`) });
    // folio del día de atención en HEV / EPI

      [...new Set(rr.fechas.map(s=>s.slice(0,10)))].forEach(f=>{
        const enDQX=(T.DQX||[]).some(t=>t.includes(f.split('-').reverse().join('/')));

  }

  // 7. ¿Realmente es un accidente de tránsito?

      const otra=todo.match(/accidente\s+(de\s+trabajo|laboral)|enfermedad\s+general|agresi[oó]n|\bri[ñn]a\b|arma\s+(blanca|de\s+fuego)|autoinflig|ca[ií]da\s+(de\s+su|desde\s+su)\s+propia\s+altura|ca[ií]da\s+de\s+(escalera|techo|[aá]rbol)/i);

      const trab=todo.match(/(?:para|hacia|rumbo\s+a|en)\s+(?:el\s+)?trabajo|camino\s+al\s+trabajo/i);

    }

      const fe=ipo.match(/Fecha\s+de\s+Evento\s+(\d{2})\/(\d{2})\/(\d{4})/i);
      if(fe){
        const ev=`${fe[3]}-${fe[2]}-${fe[1]}`, prim=rr.fechas.map(x=>x.slice(0,10)).sort()[0];

        else add('Evento','ok',`Evento el ${fe[1]}/${fe[2]}/${fe[3]}, anterior a la atención facturada`);
        const hdias=[...(T.HEV||[]),...(T.HAU||[])].join('\n').match(/(\d{1,2})\s+de\s+([a-zñ]+)\s+de\s+(\d{4})/i);
        if(hdias&&MESES[hdias[2].toLowerCase()]){const hd=`${hdias[3]}-${String(MESES[hdias[2].toLowerCase()]).padStart(2,'0')}-${String(hdias[1]).padStart(2,'0')}`;const df=Math.abs(Math.round((_pd(hd)-_pd(ev))/86400000));if(df>1&&!posterior) add('Evento','warn',`La primera atención en la historia es el ${hd} y el FURIPS dice que el evento fue el ${ev}`,`Diferencia de ${df} días: verifica la fecha del evento.`)}
      }

      if(est){

      }
    }
  }

  {
    const ipo=(T.IPO||[]).join('\n'), fac=(T.FAC||[]).join('\n');

    const mf=fac.match(/Fec\s*Egreso\s+(\d{1,2})\s+([a-zñ]{3})\.?\s+(\d{4})/i), mi=ipo.match(/Fecha\s+de\s+Egreso\s+(\d{2})\/(\d{2})\/(\d{4})/i);
    // Solo la historia clínica: fecha de egreso/alta; si no hay, el último folio con fecha
    const HCT=[...(T.EPI||[]),...(T.HEV||[]),...(T.HAU||[]),...(T.DQX||[])];
    const isoDMY=(d,m,y)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let hc=null;
    HCT.forEach(t=>{ if(hc) return;
      const x=t.match(/(?:egreso|alta)[^\d\n]{0,40}(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/i);

    else{
      const fe=[];HCT.forEach(t=>{[...t.matchAll(/(\d{1,2})\s+de\s+([a-zñ]+)\s+de\s+(\d{4})/gi)].forEach(m=>{const mo=MESES[m[2].toLowerCase()];if(mo)fe.push(isoDMY(m[1],mo,m[3]))});[...t.matchAll(/\b(\d{2})\/(\d{2})\/(\d{4})\b/g)].forEach(m=>{if(+m[2]<=12&&+m[1]<=31)fe.push(isoDMY(m[1],m[2],m[3]))})});
      const hoy=_iso(new Date()),v=fe.filter(x=>x<=hoy).sort();

    }

    }
    // b) Aviso a la autoridad (Res. 199844/2024): vehículo no asegurado/no identificado, siniestros desde 01/02/2025
    if(ipo){
      const est=(ipo.match(/Aseguramiento\s+([A-Za-zñ_]+)/i)||[])[1]||'',fe=ipo.match(/Fecha\s+de\s+Evento\s+(\d{2})\/(\d{2})\/(\d{4})/i);
      const ev=fe?`${fe[3]}-${fe[2]}-${fe[1]}`:'';
      if(/fantasma|no[_ ]?asegurado/i.test(est)&&ev>='2025-02-01'){
        if(/polic[ií]a|fiscal[ií]a|sijin|\bcti\b|inspecci[oó]n|primera\s+autoridad|denuncia|oficio/i.test(ipo)) add('Soportes','ok','El IPO menciona un aviso a la autoridad (policía / primera autoridad)');
        else add('Soportes','err','No veo el aviso a la policía judicial o primera autoridad (Res. 199844/2024)','En accidentes con vehículo no asegurado o no identificado desde el 01/02/2025 el manual exige el informe o el documento que acredite el aviso inmediato (glosa 3122, no aprobado). El IPO solo muestra el informe de atención inicial dirigido a la ADRES y «Intervención de la autoridad: NO». Si el aviso está en otra página o escaneado, confírmalo a mano.');
      }
    }
    // c) Factura PDF: resolución DIAN, rango, vigencia, CUFE, ADRES
    if(fac){
      if(!/901037916/.test(fac)) add('Factura','warn','La factura no muestra el NIT de la ADRES (901037916) como pagador','Debe estar a nombre de la ADRES (glosa 4403).');
      const rg=fac.match(/DEL\s+([A-Z]*)\s*([\d.]+)\s+AL\s+([A-Z]*)\s*([\d.]+)/i), vg=fac.match(/VIGENCIA\s+(\d{1,2})\s+([a-zñ]{3})\.?\s+(\d{4})\s*-\s*(\d{1,2})\s+([a-zñ]{3})\.?\s+(\d{4})/i);
      if(!/RESOLUCI[OÓ]N/i.test(fac)||!rg) add('Factura','err','La factura no muestra la resolución de autorización de numeración de la DIAN con su rango','Es requisito de la factura electrónica (glosa 4403).');
      else{
        const n=parseInt(String(key).replace(/\D/g,'')),a=parseInt(rg[2].replace(/\./g,'')),b=parseInt(rg[4].replace(/\./g,''));
        if(n<a||n>b) add('Factura','err',`El número ${key} está fuera del rango autorizado por la DIAN (${rg[1]}${rg[2]} a ${rg[3]}${rg[4]})`,'Glosa 4403.');
        else add('Factura','ok',`Número dentro del rango DIAN autorizado (${rg[1]}${rg[2]} a ${rg[3]}${rg[4]})`);
        if(vg&&fx&&fx.fecha){const i=f2iso(vg[1],vg[2],vg[3]),f=f2iso(vg[4],vg[5],vg[6]);if(fx.fecha<i||fx.fecha>f) add('Factura','err',`La factura se expidió el ${fx.fecha}, fuera de la vigencia de la resolución (${i} a ${f})`,'Glosa 4403.')}

      else if(fx&&fx.cufe) add('Factura','ok','CUFE del PDF = CUFE del XML');
      const cod=(fac.match(/CODIGO\s+IPS\s+(\d{12})/i)||[])[1], hab=[...new Set(rr?[...rr.procs,...rr.cons,...rr.urg,...rr.hosp].map(x=>String(x.codPrestador||'')).filter(Boolean):[])];
      const codF=(ipo.match(/Codigo\s+Habilitaci[oó]n\s+(\d{12})/i)||[])[1];
      const set=new Set([cod,codF,...hab].filter(Boolean));
      if(set.size>1) add('Factura','err',`El código de habilitación no coincide entre archivos (${[...set].join(' / ')})`,'Debe ser la misma sede en factura, RIPS y FURIPS (glosa 2103/33).');
      else if(set.size===1) add('Factura','ok',`Código de habilitación coherente (${[...set][0]})`);
    }
    if(fx){
      const sum=fx.lines.reduce((t,l)=>t+l.monto,0);
      if(fx.lines.length&&Math.abs(sum-fx.total)>1) add('Factura','err',`Los ítems del XML suman ${money(sum)} y el total de la factura es ${money(fx.total)}`,'Glosa 4012.');
    }
    // d) Valor reclamado del FURIPS vs factura
    const gm=ipo.match(/Gastos\s+Medicos\s+Quirurgicos\s+([\d.,]+)\s+([\d.,]+)/i);
    if(gm&&fx){
      const num=x=>parseFloat(x.replace(/\./g,'').replace(',','.'))||0,vf=num(gm[1]),vr=num(gm[2]);
      if(vr>fx.total+1) add('Factura','err',`El FURIPS reclama ${money(vr)}, más que la factura (${money(fx.total)})`,'El valor reclamado no puede superar el de la factura.');
      else if(vf===0&&vr>0) add('Factura','warn',`El FURIPS del IPO muestra valor facturado $0 y reclamado ${money(vr)}`,'Revisa que el valor facturado esté diligenciado.');
    }
    // e) Descripción quirúrgica: contenido mínimo
    (T.DQX||[]).forEach(t=>{
      const falta=[];
      if(!/CIRUJANO/i.test(t)) falta.push('cirujano');
      if(!/ORTOPED|CIRUG[IÍ]A|ESPECIALIDAD|ESPECIALISTA|UROLOG|GINECO|NEUROCIR|PL[AÁ]STIC|MAXILO/i.test(t.replace(/INFORME\s+QUIRURGICO/ig,''))) falta.push('especialidad del cirujano');
      if(!/FECHA\s+DE\s+LA\s+CIRUG[IÍ]A|FECHA\s+CIRUG/i.test(t)) falta.push('fecha de la cirugía');
      if(!/PROCEDIMIENTO/i.test(t)) falta.push('procedimiento realizado');
      if(falta.length) add('Contenido','warn',`La descripción quirúrgica no muestra: ${falta.join(', ')}`,'Contenido mínimo exigido por el manual de la ADRES.');
    });
  }

  if(!R.some(r=>r.lvl==='err'||r.lvl==='warn')) add('Resultado','ok','Cuenta completa y coherente: lista para digitar el FUR y el SER');
  return {R,fx,rr,prof};
}

const APR={};
function hid(s){let a=5381,b=52711;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=((a*33)^c)>>>0;b=((b*31)+c)>>>0}return a.toString(36)+b.toString(36)+s.length.toString(36)}
function normAprend(t){return String(t||'').replace(/^Revisé la alerta:\s*/i,'').replace(/^Revisé a mano \S+?:/i,'Revisé a mano un documento escaneado:').replace(/\S+\.(pdf|json|zip|xml)/ig,'').replace(/\[doc\]/g,'').replace(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}|\d{4}-\d{2}-\d{2}/g,'').replace(/\d+/g,'#').replace(/\s+/g,' ').trim().toLowerCase().slice(0,160)}
const mayus1=t=>t?t.charAt(0).toUpperCase()+t.slice(1):t;
const sinAcc=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const toksN=t=>new Set(sinAcc(t).split(/[^A-Z]+/).filter(x=>x.length>1));
const jac=(a,b)=>{const A=toksN(a),B=toksN(b);if(!A.size||!B.size)return 0;let i=0;A.forEach(x=>{if(B.has(x))i++});return i/(A.size+B.size-i)};

    p:(res.prof||[]).map(q=>({k:hid(q.reg+'|'+sinAcc(q.nombre)+'|'+sinAcc(q.esp)),reg:q.reg,nombre:q.nombre,esp:q.esp}))};

async function cargarAprendizaje(k,hecho){

    APR[k]=a;

  const st=leerEstado(key);
  res.R.forEach(r=>{if(r.lvl==='table')t+=`  [tabla] ${r.det.rows.map(f=>f.join(' | ')).join('\n          ')}\n`;else t+=`  ${ICON[r.lvl]} [${r.sec}] ${r.msg}${r.det?' — '+r.det:''}\n`});
  if(LISTAS[key]){t+='  LISTA DE CHEQUEO\n';LISTAS[key].forEach(x=>{t+=`   [${x.tipo==='ok'?'x':x.tipo==='fail'?'!':(st[x.id]?'x':' ')}] ${x.txt}${x.tipo==='fail'?' (CORREGIR)':''}\n`});t+=`   → ${resumenLista(key).t}\n`}
  return t+'\n';
}
async function procesar(files){
  $('out').innerHTML='';INFORME='';RESULT={};$('bar').style.display='none';
  agrupar([...files]);
  const keys=Object.keys(GRUPOS).sort();
  if(!keys.length){$('st').textContent='No encontré archivos con el nombre de la guía (PREFIJO_NIT_FACTURA.ext).';}
  const hechos={};
  for(const k of keys){
    $('st').textContent=`Revisando ${k}…`;
    try{hechos[k]=await revisar(k,GRUPOS[k])}
    catch(e){$('out').insertAdjacentHTML('beforeend',`<div class="card"><div class="hd"><h2>${esc(k)}</h2><span class="pill p-err">Error: ${esc(e.message)}</span></div></div>`)}
  }
  // CUFE repetido entre facturas distintas (glosa 4412)
  const porCufe={};
  Object.entries(hechos).forEach(([k,r])=>{const c=r.fx&&r.fx.cufe;if(c)(porCufe[c]=porCufe[c]||[]).push(k)});
  Object.values(porCufe).filter(v=>v.length>1).forEach(v=>v.forEach(k=>hechos[k].R.push({sec:'Factura',lvl:'err',msg:`El CUFE es igual al de otra factura (${v.filter(x=>x!==k).join(', ')})`,det:'Glosa 4412: anula la reclamación.'})));
  $('st').textContent='Consultando lo aprendido de esta IPS…';
  await Promise.all(Object.keys(hechos).map(k=>cargarAprendizaje(k,hechos[k])));
  Object.keys(hechos).forEach(k=>{RESULT[k]=hechos[k];$('out').insertAdjacentHTML('beforeend',pintar(k,hechos[k]));pintarSugerido(k);enviarTraza(k,0)});
  if(SUELTOS.length){
    $('out').insertAdjacentHTML('beforeend',`<div class="card"><div class="hd"><h2>Archivos que no se asignaron a una factura</h2></div><div class="sec">${SUELTOS.map(s=>`<div class="it l-warn"><span class="ic">⚠</span><span class="t">${esc(s.f.name)}<small>${esc(s.motivo)}</small></span></div>`).join('')}</div></div>`);
  }
  $('st').textContent=keys.length?`Listo: ${keys.length} cuenta${keys.length>1?'s':''} revisada${keys.length>1?'s':''}. Los archivos no salieron de tu computador.`:$('st').textContent;
  $('bar').style.display=keys.length?'flex':'none';
}
const drop=$('drop'),fi=$('fi');
drop.onclick=()=>fi.click();
fi.onchange=()=>procesar(fi.files);
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',ev=>procesar(ev.dataTransfer.files));
$('bcl').onclick=()=>{$('out').innerHTML='';$('bar').style.display='none';$('st').textContent='';fi.value='';INFORME=''};
$('bdl').onclick=()=>{INFORME=Object.keys(RESULT).map(k=>aTexto(k,RESULT[k])).join('');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([INFORME],{type:'text/plain;charset=utf-8'}));a.download='informe_revision_cuentas.txt';a.click()};
</script>
